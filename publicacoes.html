<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publicações | LQTSM — UERJ</title>
  <meta name="description"
    content="Artigos publicados pelo Laboratório de Química Teórica e Simulação Molecular da UERJ, com filtro por ano e busca.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>

<body data-pagina="publicacoes">

  <header data-topo></header>

  <main>

    <section class="faixa">
      <img class="faixa__fundo" src="assets/img/curvas.svg" alt="" aria-hidden="true">
      <div class="container faixa__interno">
        <h1>Publicações</h1>
        <p>Produção científica do laboratório. Use os filtros de ano ou a busca para encontrar um artigo.</p>
      </div>
    </section>

    <section class="secao">
      <div class="container">

        <!-- Filtros e busca: preenchidos por assets/js/site.js -->
        <div class="filtros">
          <div class="filtros__anos" data-filtros-ano></div>
          <div class="filtros__busca">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM21 21l-4.3-4.3" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" />
            </svg>
            <label class="somente-leitor" for="busca">Buscar publicação</label>
            <input id="busca" type="search" placeholder="Buscar por título ou revista…" data-busca>
          </div>
        </div>

        <p class="contagem" data-contagem></p>

        <!-- Lista gerada a partir de dados/publicacoes.js -->
        <div class="pilha" data-publicacoes></div>

      </div>
    </section>

  </main>

  <footer data-rodape></footer>

  <script src="dados/config.js"></script>
  <script src="dados/publicacoes.js"></script>
  <script src="assets/js/site.js"></script>
</body>

</html>
